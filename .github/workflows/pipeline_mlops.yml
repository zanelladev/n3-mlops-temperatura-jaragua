name: Previsão da máxima diária
run-name: >-
  ${{ github.event_name == 'schedule' && 'Execução diária agendada'
  || inputs.testar_alerta && 'Teste do alerta de drift'
  || inputs.data_limite && format('Execução manual com dados até {0}', inputs.data_limite)
  || 'Execução manual' }}

# Um único workflow e um único job, em sequência e sem paralelismo:
# dados novos -> ETL -> votação de features -> treino de A e B -> eleição e promoção
# -> previsões -> monitoramento de drift -> resumo -> estado salvo no repositório.
on:
  schedule:
    - cron: "17 11 * * *"   # todo dia às 11:17 UTC (08:17 em Brasília)
  workflow_dispatch:         # para depuração
    inputs:
      data_limite:
        description: "Opcional (AAAA-MM-DD): só ingerir dados até esta data, para demonstrar a chegada de um lote"
        required: false
        default: ""
      testar_alerta:
        description: "Abrir a issue de alerta mesmo sem drift, para testar o canal de notificação"
        type: boolean
        default: false

permissions:
  contents: write   # commitar o estado (dados, MLflow, manifesto e evidências)
  issues: write     # abrir a issue de alerta de drift

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  previsao:
    name: Atualizar, treinar e prever
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXECUTAR: jupyter nbconvert --to notebook --execute --output-dir executados --ExecutePreprocessor.timeout=1800
    steps:
      - name: Baixar o código e o estado salvo
        uses: actions/checkout@v7

      - name: Preparar o Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar as dependências
        run: pip install -r requirements.txt

      - name: 01 · Dados novos e ETL
        id: etl
        env:
          DATA_LIMITE: ${{ inputs.data_limite }}
        run: |
          $EXECUTAR notebooks/01_etl.ipynb
          CICLO=$(cat data/processed/ciclo_atual.txt)
          NOVOS=$(python -c "import json; print(json.load(open('evidencias/ciclos/$CICLO/ciclo.json'))['lote']['n_novos'])")
          echo "ciclo=$CICLO" >> "$GITHUB_OUTPUT"
          if [ "$NOVOS" = "0" ]; then
            echo "::notice::Nenhum dia novo no Open-Meteo: a execução para aqui, sem treinar."
            echo "novos=false" >> "$GITHUB_OUTPUT"
          else
            echo "novos=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 02 · Votação de features
        if: steps.etl.outputs.novos == 'true'
        run: $EXECUTAR notebooks/02_votacao_features.ipynb

      - name: 03 · Treino A × B
        if: steps.etl.outputs.novos == 'true'
        run: $EXECUTAR notebooks/03_treino_competicao.ipynb

      - name: 04 · Eleição e promoção
        if: steps.etl.outputs.novos == 'true'
        run: $EXECUTAR notebooks/04_selecao_promocao.ipynb

      - name: 05 · Previsão do dia seguinte
        if: steps.etl.outputs.novos == 'true'
        run: $EXECUTAR notebooks/05_previsoes.ipynb

      - name: 06 · Monitoramento de drift
        if: steps.etl.outputs.novos == 'true'
        env:
          CICLO: ${{ steps.etl.outputs.ciclo }}
        run: |
          $EXECUTAR notebooks/06_monitoramento.ipynb
          cp executados/*.ipynb "evidencias/ciclos/$CICLO/"

      - name: Resumo da execução
        run: python -c "from src import ciclo; print(ciclo.resumo_md(ciclo.atual()))" >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar o estado no repositório
        if: steps.etl.outputs.novos == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw mlflow.db mlartefatos models evidencias
          git commit -m "$(python -c 'from src import ciclo; print(ciclo.titulo(ciclo.atual()))')"
          git pull --rebase
          git push

      - name: Abrir a issue de alerta de drift
        if: steps.etl.outputs.novos == 'true' || inputs.testar_alerta
        env:
          GH_TOKEN: ${{ github.token }}
          CICLO: ${{ steps.etl.outputs.ciclo }}
          TESTAR_ALERTA: ${{ inputs.testar_alerta }}
        run: |
          ALERTA="evidencias/ciclos/$CICLO/alerta.md"
          TITULO="Alerta de drift"
          if [ "$TESTAR_ALERTA" = "true" ]; then
            ALERTA=alerta_teste.md
            TITULO="Alerta de drift (teste do canal)"
            echo "Teste manual do canal de alerta (run $GITHUB_RUN_ID). Não houve drift real." > "$ALERTA"
          fi
          if [ ! -f "$ALERTA" ]; then
            echo "Sem alerta nesta execução."
            exit 0
          fi
          NUM=$(gh issue list --state open --json number,title -q ".[] | select(.title == \"$TITULO\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file "$ALERTA"
          else
            gh issue create --title "$TITULO" --body-file "$ALERTA"
          fi

      - name: Publicar as evidências da execução
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-execucao-${{ github.run_number }}
          path: |
            executados/
            evidencias/
            models/
            mlflow.db
            mlartefatos/
          retention-days: 90
          if-no-files-found: ignore
